name: 年・人物の誤り / Wrong year or person
description: 技術ネットワークのノードの年・人物・場所などの事実の誤りを知らせる / Report a wrong year, person, place or other fact in a node
title: "[年・人物] "
labels: ["指摘: 年・人物"]
body:
  - type: markdown
    attributes:
      value: |
        ありがとうございます。ノード番号は技術ネットワーク図のカードや node.html の見出しにある [幹-番号]（例 9-07、P-01、I-06）です。
        Thank you! The node number is the [trunk-number] shown on the map card or node page (e.g. 9-07, P-01, I-06).
  - type: input
    id: node
    attributes:
      label: ノード番号 / Node number
      placeholder: "例 / e.g. 9-07"
    validations:
      required: true
  - type: textarea
    id: wrong
    attributes:
      label: どこが違うか / What is wrong
      description: いま書かれている文をそのまま写すと分かりやすいです / Quoting the current text helps
    validations:
      required: true
  - type: textarea
    id: correct
    attributes:
      label: 正しいと思う内容 / What you think is correct
    validations:
      required: true
  - type: textarea
    id: sources
    attributes:
      label: 出典 URL / Source URLs
      description: できれば信頼できる出典を2つ（論文・博物館・公式の資料など）。1行に1つ / Ideally two reliable sources (papers, museums, official records), one per line
      placeholder: https://
    validations:
      required: true
