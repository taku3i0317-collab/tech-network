name: 前提（つながり）の誤り / Wrong prerequisite (connection)
description: 「この技術が無いと作れない」というつながりの誤り・足りないつながりを知らせる / Report a wrong or missing link between technologies
title: "[つながり] "
labels: ["指摘: つながり"]
body:
  - type: markdown
    attributes:
      value: |
        つながりの種類：**前提**（無いと作れない）／**別ルート**（A か B のどちらかで足りる）／**理解**（なぜ動くかを後で説明した科学）。
        Link types: **prerequisite** (cannot be made without it) / **alternative route** (either A or B is enough) / **understanding** (science that later explained why it works).
  - type: input
    id: node
    attributes:
      label: ノード番号 / Node number
      placeholder: "例 / e.g. 9-07"
    validations:
      required: true
  - type: input
    id: other
    attributes:
      label: 相手のノード番号（あれば） / The other node number (if any)
      placeholder: "例 / e.g. 1-26"
  - type: dropdown
    id: kind
    attributes:
      label: 種類 / Kind
      options:
        - 前提が違う（要らない） / This prerequisite is not needed
        - 前提が足りない / A prerequisite is missing
        - 別ルート（or）にすべき / Should be an alternative route (or)
        - 理解（説明）のつながりにすべき / Should be an understanding link
        - その他 / Other
    validations:
      required: true
  - type: textarea
    id: wrong
    attributes:
      label: どこが違うか / What is wrong
    validations:
      required: true
  - type: textarea
    id: sources
    attributes:
      label: 出典 URL / Source URLs
      description: 1行に1つ / One per line
      placeholder: https://
