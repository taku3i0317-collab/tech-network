name: 画像・動画の提案 / Suggest an image or video
description: ノードのページに見せたい画像・動画を提案する（リンクだけ。docs/MEDIA.md の方針） / Suggest an image or video for a node page (links only; see docs/MEDIA.md)
title: "[画像・動画] "
labels: ["提案: 画像・動画"]
body:
  - type: markdown
    attributes:
      value: |
        ファイルはリポジトリに入れず、リンクで載せます。ライセンスがはっきりした所（Wikimedia Commons など）のもの、子どもが見て大丈夫なものだけです。
        Files are not stored in the repository, only linked. Only items with a clear license (e.g. Wikimedia Commons) that are suitable for children.
  - type: input
    id: node
    attributes:
      label: ノード番号 / Node number
      placeholder: "例 / e.g. 9-07"
    validations:
      required: true
  - type: input
    id: url
    attributes:
      label: 画像・動画のページの URL / URL of the image or video page
      placeholder: https://commons.wikimedia.org/wiki/File:...
    validations:
      required: true
  - type: dropdown
    id: kind
    attributes:
      label: 種類 / Kind
      options:
        - 画像 / Image
        - 動画 / Video
    validations:
      required: true
  - type: input
    id: license
    attributes:
      label: ライセンスと作者 / License and author
      placeholder: "例 / e.g. Public domain（PD-old）, 作者 / author: ..."
    validations:
      required: true
  - type: textarea
    id: description
    attributes:
      label: 説明（何が写っているか） / Description (what it shows)
    validations:
      required: true
