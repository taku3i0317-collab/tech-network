<script>
(function () {

  const nodes = G.nodes, byId = new Map(nodes.map(n => [n.id, n]));

  document.addEventListener('click', e => { if (!menu.hidden && !menu.contains(e.target) && e.target !== menuBtn) setMenu(false); });
  document.addEventListener('keydown', e => { if (e.key === 'Escape') setMenu(false); });

  let LANG = 'ja';
  try { LANG = localStorage.getItem('tn-lang') === 'en' ? 'en' : 'ja'; } catch (e) { /* 保存できない環境 */ }
  const EN_UI = { 'つながりで見る': 'Network view', '時間で見る': 'Timeline view', 'AI までの道': 'Road to AI', '人物の一覧': 'People',

    // S-015：スマホの近所の図
    'ほか': 'and', '全部見る': 'show all', '石器から AI まで、約600の技術・モノ・発見が「何が無いと何が作れないか」でつながっています。': 'About 600 technologies, products and discoveries, from stone tools to AI, linked by what each one needed. ',

    const anonTile = anon.length ? tile(crowd, '名前の残っていない、無数の人たち', `${anon.length} の技術`, anon[0], `${ANON_BEFORE}年より前で、発明した人の名前が残っていない技術：` + anon.map(i => byId.get(i).name).join('、')) : '';
    return `<details class="wall sec"><summary>この技術の裏にいる人：<b>${people.length}</b> 人${anon.length ? `＋名前の残っていない人たち（${anon.length} の技術）` : ''}</summary>
      <div class="wgrid">${people.map(({ p, techs }) => tile(p.portrait ? `<img src="${p.portrait}" alt="">` : silhouette, p.name, techs.map(i => byId.get(i).name).join('・'), techs[0], `${p.name}（${p.year}）`)).join('')}${anonTile}</div></details>`;
  }
  // 祖先を近い順の層で（NET-09）：1〜2層だけ開き、遠い層は「さらにさかのぼると、あと N 個」で閉じる。
  // 祖先を押すと、そこから選んだノードまでの1本の道を矢印で出し、図でもその道を太くする
  const LAYER_NAME = k => k === 1 ? '直接の前提' : k === 2 ? 'その前提' : `${k}段前`;
  function layersHtml(id) {
    const L = layersOf(id), by = new Map();
    for (const [i, k] of L.dist) (by.get(k) || by.set(k, []).get(k)).push(i);
    if (!by.size) return '';
    const ks = [...by.keys()].sort((a, b) => a - b), total = L.dist.size;
    const one = k => `<div class="layer"><h4>${k}層：${LAYER_NAME(k)}（${by.get(k).length}）</h4><div class="chips">${by.get(k)
      .sort((a, b) => (byId.get(a).year ?? 0) - (byId.get(b).year ?? 0)).map(i => `<button class="chip lchip" data-id="${i}">${i} ${esc(byId.get(i).name)}</button>`).join('')}</div></div>`;
    const near = ks.filter(k => k <= 2), far = ks.filter(k => k > 2), farN = far.reduce((x, k) => x + by.get(k).length, 0);
    return `<div class="sec"><h3>${isProd(byId.get(id)) ? 'このモノ' : 'この技術'}をさかのぼる（近い順、全部で ${total}）</h3>
      <div class="pathbox" hidden></div>${near.map(one).join('')}
      ${far.length ? `<details class="farlayers"><summary>さらにさかのぼると、あと ${farN} 個（${far[0]}〜${far[far.length - 1]}段前）</summary>${far.map(one).join('')}</details>` : ''}
      <p class="muted" style="font-size:12px">技術を押すと、そこから${esc(byId.get(id).name)}までの道が出ます</p></div>`;
  }
  function showPath(from, id, card) {
    const L = layersOf(id), path = pathTo(from, L);
    state.path = path; render();
    const box = card.querySelector('.pathbox');
    box.hidden = false;
    box.innerHTML = `<div class="pathline">${path.map(i => `<button class="chip" data-id="${i}">${esc(byId.get(i).name)}</button>`).join('<span class="arrow">→</span>')}</div>
      <button class="close pathclose" aria-label="道を消す">×</button>`;
    box.querySelectorAll('.chip').forEach(b => b.onclick = () => { select(b.dataset.id); center(b.dataset.id); });
    box.querySelector('.pathclose').onclick = () => { state.path = null; box.hidden = true; render(); };
  }
  function select(id) {
    state.path = null;
    state.sel = id; render();
    const card = document.getElementById('card');
    if (!id) { card.classList.remove('open'); setTimeout(() => { if (!card.classList.contains('open')) card.innerHTML = ''; }, 250); return; }   // 中身は下がり終わってから消す（S-020 C）
    selPulse = performance.now();
    // カードは先に開いて（図の幅が決まり、中央合わせがずれない）、中身は重いデータを読んでから
    if (!window.TECH_DETAIL) {
      const d = byId.get(id);
      card.innerHTML = `<button class="close" aria-label="閉じる">×</button><h2><span>[${d.id}] ${esc(d.name)} ${d.status}</span></h2><p class="loading">読み込み中…</p>`;
      card.classList.add('open');
      card.querySelector('.close').onclick = () => { select(null); if (PHONE) history.pushState(null, '', '#map'); };
    }
    ensureDetail().then(() => { if (state.sel === id) fillCard(id); });
  }
  function fillCard(id) {
    const card = document.getElementById('card');
    const d = byId.get(id), used = [...anc.get(id)];
    const still = makeable(id), lost = [...ALL].filter(x => x !== id && !still.has(x));
    const req = d.requires.map(alts => alts.map(a => a.map(chip).join(' + ')).join(' <span style="color:var(--sub)">または（別の作り方）</span> ')).join('<br>');
    // 使われている技術を分野（幹）ごとにまとめて折りたたむ（U-5）
    const byTrunk = new Map();
    for (const i of used) { const t = byId.get(i).trunk; (byTrunk.get(t) || byTrunk.set(t, []).get(t)).push(i); }
    const trunkHtml = used.length ? `<details class="trunks sec"><summary>分野ごとに見る（${byTrunk.size} 分野）</summary>${[...byTrunk.entries()]
      .sort((a, b) => b[1].length - a[1].length).map(([t, ids]) => `<details><summary>${esc(byId.get(ids[0]).trunk_name || t)}（${ids.length}）</summary><div class="chips">${ids.sort().map(chip).join('')}</div></details>`).join('')}</details>` : '';
    const next = kids.get(id) || [];
    const head = d.icon ? `<img src="${d.icon}" alt="">` : `<span class="em">${esc(isProd(d) ? (d.emoji || d.symbol) : isIdea(d) ? (d.emoji || '💡') : d.symbol)}</span>`;
    const chips = ids => `<div class="chips">${ids.map(chip).join('')}</div>`;
    card.innerHTML = `<button class="close" aria-label="閉じる">×</button>
      <h2>${head}<span>[${d.id}] ${esc(d.name)} ${d.status}</span></h2>
      <a class="more" href="node.html#${encodeURIComponent(d.id)}">詳しく見る →</a><button type="button" class="more" data-share="${d.id}" data-share-view="map">${tr('🔗 シェア')}</button>${isProd(d) ? ` <button type="button" class="more" data-film="${d.id}">${tr('▶ できるまでを観る')}</button>` : ''}
      <div class="meta"><span style="color:${isIdea(d) ? IDEA : isProd(d) ? DS.prod : color(d.trunk)}">${isIdea(d) ? '◆' : '●'}</span> ${isProd(d) ? '<b>モノ</b>・' : ''}${esc(d.trunk_name)}${d.trunk === 'P' || d.trunk === 'I' ? '' : `<small class="term">（${d.trunk === 'B' ? '枝' : '幹' + d.trunk}）</small>`}・${yearText(d)}${d.buildable_now ? '・<b>今すぐ作れる</b>' : ''}</div>
      ${wallHtml(id)}
      ${d.people.length ? `<div class="sec"><h3>人物</h3><div class="people">${d.people.map(p => `<div class="person">${p.portrait ? `<img class="portrait" src="${p.portrait}" alt="">` : silhouette}<div><b>${esc(p.name)}</b><small>${esc(p.tool)}・${esc(p.year)}</small></div></div>`).join('')}</div></div>` : ''}
      ${d.hee1 ? `<div class="sec"><h3>へえ①</h3>${AutoLink.link(esc(d.hee1), d.id, g => '#' + g)}</div>` : ''}
      ${d.play ? `<div class="sec"><h3>遊び方</h3>${esc(d.play)}</div>` : ''}
      ${d.enables.length ? `<div class="sec"><h3>この考え方で作れるようになった技術</h3>${chips(d.enables)}</div>` : ''}
      ${d.explains.length ? `<div class="sec"><h3>この考え方が説明する技術</h3>${chips(d.explains)}</div>` : ''}
      ${d.enabled_by.length ? `<div class="sec"><h3>これを作れるようにした考え方</h3>${chips(d.enabled_by)}</div>` : ''}
      ${d.explained_by.length ? `<div class="sec"><h3>なぜ動くかを説明する考え方</h3>${chips(d.explained_by)}</div>` : ''}
      ${d.missing ? `<div class="sec"><h3>足りない技術（ノードを提案中）</h3>${esc(d.missing)}</div>` : ''}
      ${d.real ? `<div class="sec"><h3>本当の話 <small class="term">（本物）</small></h3>${AutoLink.link(esc(d.real), d.id, g => '#' + g)}</div>` : ''}
      ${layersHtml(id)}
      ${trunkHtml}
      ${isIdea(d) ? '' : `<div class="sec"><h3>これが無いと作れなくなる技術 <small class="term">（別の作り方も考えたうえで）</small></h3><div class="big">${lost.length}</div><div class="chips">${lost.map(chip).join('')}</div></div>`}
      <div class="sec"><h3>これが無いと作れない <small class="term">（前提。全部そろうと作れる）</small></h3>${req || 'なし'}</div>
      ${d.understanding.length ? `<div class="sec"><h3>なぜ動くかの説明 <small class="term">（理解：後で分かった科学）</small></h3><div class="chips">${d.understanding.map(chip).join('')}</div></div>` : ''}
      <div class="sec"><h3>すぐ次の技術（${next.length}）</h3><div class="chips">${next.map(chip).join('')}</div></div>`;
    card.classList.add('open');
    card.querySelector('.close').onclick = () => { select(null); if (PHONE) history.pushState(null, '', '#map'); };
    card.querySelectorAll('.lchip').forEach(b => b.onclick = ev => { ev.stopPropagation(); showPath(b.dataset.id, id, card); });
    card.querySelectorAll('.wtile').forEach(b => b.onclick = () => goMap(b.dataset.id));
    card.querySelectorAll('.chip:not(.lchip)').forEach(b => b.onclick = () => goMap(b.dataset.id));
  }
  // 見えている図の真ん中の高さ。スマホでカードが下に開いているときは、カードより上の部分の真ん中（S-014：カードが図をふさぐ）
  function midY(b) {
    const c = document.getElementById('card'), cr = c.classList.contains('open') ? c.getBoundingClientRect() : null;
    const bottom = cr && cr.top > b.top && cr.left <= b.left + 1 ? Math.min(b.bottom, cr.top) : b.bottom;
    return (bottom - b.top) / 2;
  }
  function centerKeep(id) {   // 倍率は変えずに、押した点を図の真ん中へ
    const d = byId.get(id), b = chart.getBoundingClientRect(), k = d3.zoomTransform(cv).k;
    d3.select(cv).transition().duration(500).call(zoom.transform, d3.zoomIdentity.translate(b.width / 2 - d.x * k, midY(b) - d.y * k).scale(k));
  }
  function center(id) {
    const d = byId.get(id), b = chart.getBoundingClientRect(), t = d3.zoomTransform(cv), k = Math.max(t.k, 1);
    d3.select(cv).transition().duration(500).call(zoom.transform, d3.zoomIdentity.translate(b.width / 2 - d.x * k, midY(b) - d.y * k).scale(k));
  }

  // ---- 操作 ----
  const sel = document.getElementById('trunk');
  trunks.forEach(t => sel.insertAdjacentHTML('beforeend', `<option value="${t}">${trunkName(t)}（${t === 'B' ? '枝' : '幹' + t}）</option>`));
  sel.onchange = () => { state.trunk = sel.value; render(); };
  document.getElementById('all').onchange = e => { state.all = e.target.checked; render(); };
  document.getElementById('layoutBtn').onclick = () => { applyLayout(layoutMode === 'net' ? 'time' : 'net'); render(); };
  document.getElementById('aiBtn').onclick = () => { if (PHONE) { setMenu(false); location.hash = G.goal; } else { select(G.goal); centerKeep(G.goal); } };   // AI までの道（U-11）
  const lb = document.getElementById('legendBtn'), lg = document.getElementById('legend');
  lb.onclick = () => { lg.hidden = !lg.hidden; lb.setAttribute('aria-expanded', String(!lg.hidden)); };
  document.getElementById('now').onchange = e => { state.now = e.target.checked; render(); };
  document.getElementById('und').onchange = e => { state.und = e.target.checked; render(); };
  const qi = document.getElementById('q');
  // 検索の結果を一覧で（技術・モノ・発見と、人物）。押すとその点へ（U-7）
  const resBox = document.getElementById('results');
  function showResults() {
    const q = state.q.trim().toLowerCase();
    if (!q) { resBox.hidden = true; resBox.innerHTML = ''; return; }
    const hit = nodes.filter(d => matches(d, q)).sort((a, b) => (b.name.toLowerCase().includes(q) - a.name.toLowerCase().includes(q)) || (a.year ?? 0) - (b.year ?? 0)).slice(0, 30);
    const ppl = [];
    for (const n of nodes) for (const p of n.people || []) if (p.name.toLowerCase().includes(q)) ppl.push({ p, n });
    const kindName = d => isProd(d) ? 'モノ' : isIdea(d) ? '発見' : '技術';
    resBox.innerHTML = (ppl.slice(0, 10).map(({ p, n }) => `<button data-id="${n.id}">👤 <span><b>${esc(p.name)}</b> <small>${esc(p.year)}・${esc(n.name)}</small></span></button>`).join('')
      + hit.map(d => `<button data-id="${d.id}"><span><b>${esc(d.name)}</b> <small>${kindName(d)}・[${d.id}]・${yearText(d)}</small></span></button>`).join(''))
      || '<p class="muted" style="padding:8px 10px;margin:0">見つかりませんでした</p>';
    resBox.hidden = false;
    resBox.querySelectorAll('button').forEach(b => b.onclick = () => { resBox.hidden = true; goAny(b.dataset.id); });
  }
  qi.oninput = () => { state.q = qi.value; render(); showResults(); if (state.q.trim()) ensureDetail().then(() => { render(); showResults(); }); };   // 本物・へえ・人物でも探せるように重いデータを読む
  qi.onfocus = () => { if (state.q.trim()) showResults(); };
  document.addEventListener('click', ev => { if (!ev.target.closest('.searchbox')) resBox.hidden = true; });
  qi.onkeydown = e => {
    if (e.key !== 'Enter') return;
    const q = qi.value.trim().toLowerCase().replace(/[\[\]]/g, '');
    const hit = nodes.find(n => n.id.toLowerCase() === q) || nodes.find(n => n.name.toLowerCase().includes(q)) || nodes.find(n => matches(n, q));
    if (hit) { resBox.hidden = true; goAny(hit.id); }
  };
  // ---- S-015：スマホは「近所の図」（案B）が基本。「全体の地図」で今の図（案A：図と下のカード）。パソコンは今のまま ----
  // URL：#9-23＝近所の図で 9-23、#map＝全体の地図、#map/9-23＝全体の地図で 9-23 を選んだところ。戻るボタンで前の画面へ戻れる
  const focusEl = document.getElementById('focus'), fbar = document.getElementById('fbar'), toFocus = document.getElementById('toFocus');
  let curFocus = null;
  function goMap(id) { if (PHONE) location.hash = 'map/' + id; else { select(id); center(id); } }
  function goAny(id) { if (PHONE) location.hash = (document.body.classList.contains('focusMode') ? '' : 'map/') + id; else { select(id); centerKeep(id); } }
  const ficon = n => n.icon ? `<img src="${n.icon}" alt="">` : `<span class="em">${esc(isProd(n) ? (n.emoji || n.symbol) : isIdea(n) ? (n.emoji || '💡') : n.symbol)}</span>`;
  const ftile = id => { const n = byId.get(id); return `<a class="tile ${n.status === '✅' ? 'done' : ''}" href="#${id}">${ficon(n)}<span>${esc(n.name)}<small>${n.year != null ? esc(yearText(n).replace(/（.*$/, '')) : ''}</small></span></a>`; };
  const yPct = y => { const d = L.xs[0], r = L.xs[1]; return Math.max(0, Math.min(100, xs(Math.max(d[0], Math.min(d[d.length - 1], y))) / r[r.length - 1] * 100)); };
  function tilesHtml(ids, max, key) {
    const u = [...new Set(ids)].filter(i => byId.has(i)).sort((a, b) => (byId.get(a).year ?? 9999) - (byId.get(b).year ?? 9999));
    if (!u.length) return '';
    return `<div class="grid">${u.slice(0, max).map(ftile).join('')}</div>` + (u.length > max ? `<button type="button" class="more" data-more="${key}">${tr('ほか')} ${u.length - max} … ${tr('全部見る')}</button><div class="grid" data-rest="${key}" hidden>${u.slice(max).map(ftile).join('')}</div>` : '');
  }
  function showFocus(id) {
    document.body.classList.add('focusMode');
    focusEl.hidden = false; fbar.hidden = false; toFocus.hidden = true;
    if (document.getElementById('card').classList.contains('open')) select(null);
    curFocus = id;
    const toNode = document.getElementById('toNode');
    if (!id) {   // はじめの画面：モノを年の順に
      toNode.style.display = 'none';
      focusEl.innerHTML = `<p class="lead">${tr('石器から AI まで、約600の技術・モノ・発見が「何が無いと何が作れないか」でつながっています。')}<b>${tr('モノを1つ選んでみよう。')}</b></p>
        <h3>${tr('モノ（年の順）')}</h3>${tilesHtml(prods.map(n => n.id), 999, 'p')}`;
      focusEl.scrollTop = 0; return;
    }
    const d = byId.get(id);
    toNode.style.display = ''; toNode.href = `node.html#${id}`;
    const par = (parents.get(id) || []).filter(i => byId.has(i)), kid = (kids.get(id) || []).filter(i => byId.has(i));
    const marks = [1800, 1900, 1950, 2000].map(y => `<span style="left:${yPct(y)}%">${y}</span>`).join('');
    focusEl.innerHTML = `
      <div class="time" aria-hidden="true">${marks}${par.map(i => byId.get(i).year != null ? `<i class="p" style="left:${yPct(byId.get(i).year)}%"></i>` : '').join('')}${d.year != null ? `<i style="left:${yPct(d.year)}%"></i>` : ''}</div>
      <h3>▲ ${tr('これを作るのに要った物')}（${tr('前提')} ${new Set(par).size}）</h3>
      ${tilesHtml(par, 6, 'par') || `<p class="muted" style="margin:0 12px">${tr('なし（ここが出発点）')}</p>`}
      <div class="arrow">↓</div>
      <div class="me"><div class="top">${ficon(d)}<div><h2>[${d.id}] ${esc(d.name)}</h2>
        <div class="meta">${esc(yearText(d))}・${esc(d.trunk_name)}<br>${d.status === '✅' ? tr('✅ ゲームにある') : tr('まだゲームに無い')}・${tr('この先に')} ${d.descendants} ${tr('の技術')}</div></div></div>
        <p class="hee" id="fhee"></p><button type="button" class="btn" data-share="${d.id}" data-share-view="center" style="margin:8px 8px 0 0">${tr('🔗 シェア')}</button>${isProd(d) ? `<button type="button" class="btn" data-film="${d.id}" style="margin-top:8px">${tr('▶ できるまでを観る')}</button>` : ''}</div>
      <div class="arrow">↓</div>
      <h3>▼ ${tr('これで作れるようになった物')}（${tr('次の技術')} ${new Set(kid).size}）</h3>
      ${tilesHtml(kid, 8, 'kid') || `<p class="muted" style="margin:0 12px">${tr('なし')}</p>`}`;
    focusEl.querySelectorAll('.more').forEach(b => b.onclick = () => { focusEl.querySelector(`[data-rest="${b.dataset.more}"]`).hidden = false; b.remove(); });
    focusEl.scrollTop = 0;
    ensureDetail().then(() => { const h = document.getElementById('fhee'); if (h && curFocus === id) h.textContent = d.hee1 ? tr('へえ') + '：' + d.hee1 : ''; });
  }
  function showMap(id) {
    document.body.classList.remove('focusMode');
    focusEl.hidden = true; fbar.hidden = true; toFocus.hidden = false;
    resize();
    // カードは重いデータを読んでから開くので、開いたあとでカードより上の真ん中に合わせ直す
    if (id && byId.has(id)) { if (state.sel !== id) select(id); center(id); ensureDetail().then(() => requestAnimationFrame(() => center(id))); } else if (state.sel) select(null);
  }
  document.getElementById('toMap').onclick = () => { location.hash = 'map' + (curFocus ? '/' + curFocus : ''); };
  toFocus.onclick = () => { location.hash = state.sel || ''; if (!state.sel) fromHash(); };
  const fromHash = () => {
    const h = decodeURIComponent(location.hash.slice(1));
    const m = h.match(/^map(?:\/(.*))?$/);
    if (PHONE) { if (m) showMap(m[1]); else showFocus(byId.has(h) ? h : null); return; }
    const id = m ? m[1] : h;
    if (id && byId.has(id)) { select(id); center(id); }
  };
  window.addEventListener('hashchange', fromHash);
  let saved = 'time';
  try { saved = localStorage.getItem('tn-layout') || 'time'; } catch (e) { /* 保存できない環境では時間軸 */ }
  placeLabels();
  if (saved === 'net') applyLayout('net', false);
  started = true;
  render();
  fromHash();
})();

<script>
// S-020・S-021：「〇〇を作るには？」ミニムービー（film.js）。終わり・とばすと「中心図」（真ん中にそのモノ、外へいくほど昔の前提）で止まる。
// URL：#center/番号＝中心図。丸を押して真ん中を変えるたびに残るので、戻るボタンで前の真ん中へ、さらに戻ると中心図を閉じる。✕ で閉じるとそのモノへ
(function () {
  // S-022（ユーザーの決定）：スマホの基本の見方は中心図。はじめてはムービーの続きでスマホ、2回目からは前に見ていた物（無ければスマホ）。
  // スマホでは #番号 も中心図で開き、✕ で閉じると全体の地図へ。パソコンは今のまま
  const PH = matchMedia('(max-width: 700px)').matches;
  const lastId = () => { try { const v = localStorage.getItem('tn-center-last'); return v && v; } catch (e) { return null; } };
  let ctl = null, quiet = false;
  const go = id => { if (location.hash.slice(1) === id) window.dispatchEvent(new HashChangeEvent('hashchange')); else location.hash = id; };
  const opts = { onCenter: k => { try { localStorage.setItem('tn-center-last', k); } catch (e) { /* 保存できない */ } if (location.hash !== '#center/' + k) history.pushState(null, '', '#center/' + k); },
                 onClose: k => { ctl = null; if (!quiet) { if (PH) location.hash = 'map/' + k; else go(k); } quiet = false; } };
  const openCenter = id => { history.replaceState(null, '', '#center/' + id); try { localStorage.setItem('tn-center-last', id); } catch (e) { /* 保存できない */ } if (ctl) ctl.center(id); else ctl = Film.center(id, opts); };
  const open = id => { if (ctl) ctl.close(); ctl = Film.play(id, opts); };
  document.addEventListener('click', e => { const b = e.target.closest('[data-film]'); if (b) { e.preventDefault(); if (b.closest('#menu')) { document.getElementById('menu').hidden = true; document.getElementById('menuBtn').setAttribute('aria-expanded', 'false'); } open(b.dataset.film); } });
  const fromHash = () => {
    const m = location.hash.match(/^#center\/(.+)$/);
    const plain = location.hash.match(/^#([^/]+)$/);
    if (m) { const id = decodeURIComponent(m[1]); if (ctl) ctl.center(id); else ctl = Film.center(id, opts); }
    else if (PH && plain && window.TECH_GRAPH.nodes.some(n => n.id === decodeURIComponent(plain[1]))) openCenter(decodeURIComponent(plain[1]));
    else if (ctl) { quiet = true; ctl.close(); }
  };
  window.addEventListener('hashchange', fromHash);
  window.openFilm = open;
  if (/^#center\//.test(location.hash) || (PH && /^#[^/]+$/.test(location.hash))) fromHash();
  // 初めての1回だけ、スマホのムービー（番号つきの URL で来た人には出さない）。スマホの2回目からは中心図（前に見ていた物）
  else if (!location.hash) { ctl = Film.firstTime('B-10', opts); if (!ctl && PH) openCenter(lastId() || 'B-10'); }
})();
</script>
