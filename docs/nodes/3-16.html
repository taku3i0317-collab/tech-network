<h2 data-en="Real history">本当の歴史</h2><p>空気を抜いて加熱すると酸化せず、気体が出る反応が進む（Mg 蒸留[1-39]、W/Mo の焼結[1-28][1-31]、ウェハーのアニール）。1929年にレイセオンが最初の真空炉を発注（イプセン社史）、工業的な普及は1950年代末〜60年代⚠️</p>
