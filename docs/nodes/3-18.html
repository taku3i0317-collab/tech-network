<h2 data-en="Real history">本当の歴史</h2><p>1856 ジーメンス（シーメンス）兄弟（フリードリヒとヴィルヘルム）が特許：排ガスでれんがの格子を温め、流れを切り替えて次の空気とガスを予熱 → 炎だけで鉄の融点を超える。これは「炉＝設備」で、製鋼の「工程」としての使い方は1864 マルタンの平炉法＝[1-12]</p>
