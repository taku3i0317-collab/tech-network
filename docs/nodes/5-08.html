<h2 data-k="ui.real_history" data-en="Real history">本当の歴史</h2><p>1958頃 バリアン社（ホール⚠️）のスパッタイオンポンプ。放電で気体をイオンにし、チタン陰極にたたき込んで閉じ込める（チタンが飛び散って新しい面が気体を吸う）。可動部・油なし、10⁻⁹Pa</p>
