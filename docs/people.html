<!doctype html>
<html lang="ja">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>人物の一覧 — 技術ネットワーク</title>
<!-- 技術ネットワークに出てくる人物（自作のドット絵の肖像）の一覧。時代ごと。押すとその人が関わった技術のページ（node.html）へ。
     データは tech_network_graph.js と tech_network_detail.js（tools/gen_tree_views.py）。見た目は design.css（docs/DESIGN_SYSTEM.md） -->
<style>
* { box-sizing: border-box; }
body { margin: 0; line-height: 1.7; font-size: 15px; }
.wrap { max-width: 980px; margin: 0 auto; padding: 12px 16px 48px; }
nav { display: flex; gap: 12px; flex-wrap: wrap; align-items: center; font-size: 13px; padding: 6px 0 10px; }
nav a { text-decoration: none; }
nav input { padding: 4px 8px; border: 1px solid var(--line); background: var(--panel); color: var(--ink); width: 220px; max-width: 100%; }
h1 { font-size: 20px; margin: 4px 0; }
.muted { color: var(--sub); font-size: 13px; }
section h2 { display: flex; justify-content: space-between; gap: 8px; }
.grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(150px, 1fr)); gap: 10px; }
.person { display: flex; gap: 8px; align-items: flex-start; border: 1px solid var(--line); border-radius: var(--radius); padding: 8px; background: var(--bg); color: var(--ink); text-decoration: none; }
.person:hover { border-color: var(--accent); }
.person img { width: 48px; height: 48px; image-rendering: pixelated; flex: none; }
.person b { display: block; font-size: 14px; line-height: 1.3; }
.person small { display: block; color: var(--sub); font-size: 12px; line-height: 1.35; }
.crowd { flex: none; }
</style>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=BIZ+UDPGothic:wght@400;700&family=DotGothic16&display=swap">
<link rel="stylesheet" href="design.css">
</head>
<body>
<div class="wrap">
  <nav>
    <a href="network.html">← 技術ネットワーク図へ</a>
    <a href="node.html#10-16">AI までの道</a>
    <a href="glossary.html">用語集</a>
    <input type="search" id="q" placeholder="名前・技術でさがす" aria-label="人物をさがす">
    <button type="button" id="furiBtn" class="btn" aria-pressed="false">ふりがな</button>
  </nav>
  <header class="top"><div><h1>人物の一覧</h1>
    <div class="muted">技術ネットワークに出てくる人たち。肖像は自作のドット絵（髪・ひげ・服などの特徴だけ）で、写真や絵の写しではありません。存命の人は載せていません。
    名前の残っていない、たくさんの人たちの工夫の上に、この人たちの仕事があります。押すと、その人が関わった技術のページへ。</div></div></header>
  <main id="page"><p class="muted">読み込み中…</p></main>
</div>
<script src="tech_network_graph.js"></script>
<script src="tech_network_detail.js"></script>
<script>
(function () {
  const G = window.TECH_GRAPH, D = window.TECH_DETAIL;
  const byId = new Map(G.nodes.map(n => [n.id, { ...n, ...D.nodes[n.id] }]));
  const esc = s => String(s ?? '').replace(/[&<>"]/g, c => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;' }[c]));
  // 人物の年（"1804"・"1040年代"・"8〜9世紀"）を並べるための数に（node.html と同じ読み方）
  const personYear = (p, n) => {
    const s = String(p.year || ''), c = s.match(/(\d+)\s*(?:〜\d+)?\s*世紀/);
    if (c) return (+c[1] - 1) * 100 + 50;
    const m = s.match(/\d+/);
    return m ? (s.includes('前') ? -m[0] : +m[0]) : (n.year ?? 9999);
  };
  // 同じ人は1人にまとめ、関わった技術を並べる
  const people = new Map();
  for (const n of byId.values()) for (const p of n.people || []) {
    const o = people.get(p.name) || { p, techs: [], y: personYear(p, n) };
    if (!o.techs.includes(n.id)) o.techs.push(n.id);
    people.set(p.name, o);
  }
  const ERAS = [['紀元前〜1500年', -1e9, 1500], ['1501〜1800年', 1501, 1800], ['1801〜1900年', 1801, 1900], ['1901〜1950年', 1901, 1950], ['1951年〜', 1951, 1e9]];
  const silhouette = `<svg width="48" height="48" viewBox="0 0 34 34" aria-hidden="true"><circle cx="17" cy="11" r="7" fill="var(--sub)"/><path d="M4 33c0-8 6-13 13-13s13 5 13 13z" fill="var(--sub)"/></svg>`;
  function render() {
    const q = document.getElementById('q').value.trim().toLowerCase();
    const list = [...people.values()].filter(o => !q || o.p.name.toLowerCase().includes(q) || o.techs.some(i => byId.get(i).name.toLowerCase().includes(q)))
      .sort((a, b) => a.y - b.y);
    const portrait = o => o.p.pi != null ? `<img src="${D.portraits[o.p.pi]}" alt="">` : silhouette;
    const card = o => `<a class="person" href="node.html#${o.techs[0]}">${portrait(o)}<span><b>${esc(o.p.name)}</b><small>${esc(o.p.year)}・${esc(o.p.tool || '')}</small><small>${o.techs.map(i => esc(byId.get(i).name)).join('・')}</small></span></a>`;
    const html = ERAS.map(([label, lo, hi]) => {
      const xs = list.filter(o => o.y >= lo && o.y <= hi);
      return xs.length ? `<section><h2>${label}<span class="muted">${xs.length} 人</span></h2><div class="grid">${xs.map(card).join('')}</div></section>` : '';
    }).join('');
    document.getElementById('page').innerHTML = html || '<p class="muted">見つかりませんでした</p>';
  }
  document.getElementById('q').oninput = render;
  render();
})();
</script>
<script src="vendor/budoux-ja.min.js"></script>
<script src="linebreak.js"></script>
<script>LineBreak.init();</script>
<script src="furigana.js"></script>
<script>Furigana.init(document.getElementById('furiBtn'));</script>
</body>
</html>
